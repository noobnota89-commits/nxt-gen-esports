<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NXT GEN ESPORTS SCRIMS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">NXT GEN <span>ESPORTS</span> SCRIMS</div>
  <a href="#register">REGISTER</a>
</header>
<main>
<section class="poster">
  <button onclick="document.getElementById('register').scrollIntoView({behavior:'smooth'})">
    <img src="poster.png" alt="NXT GEN ESPORTS Daily Grind Scrims poster">
    <b>Tap to Register</b>
  </button>
</section>

<section class="availability">
  <p class="eyebrow">LIVE AVAILABILITY</p>
  <h1>Choose your timing</h1>
  <p>Maximum 18 teams per timing.</p>
  <div id="slots" class="grid"></div>
</section>

<section id="register" class="register">
  <p class="eyebrow">REGISTRATION</p>
  <h1>Book your scrim slot</h1>
  <p>Payment confirmation will be handled through WhatsApp.</p>
  <form id="form">
    <label>Team name<input id="team" required placeholder="Enter team name"></label>
    <label>Contact number<input id="contact" type="tel" required placeholder="WhatsApp number"></label>
    <label>Slot timing<select id="timing" required>
      <option value="">Select timing</option>
      <option>1–3 PM</option><option>3–5 PM</option><option>5–7 PM</option>
      <option>7–9 PM</option><option>9–11 PM</option><option>11 PM–1 AM</option>
    </select></label>
    <label>Number of slots needed<input id="number" type="number" min="1" max="18" value="1" required></label>
    <label>Price category<select id="price" required>
      <option value="">Select price category</option><option>₹40</option><option>₹60</option><option>₹120</option>
    </select></label>
    <button type="submit">REGISTER VIA WHATSAPP</button>
    <small id="message"></small>
  </form>
</section>
</main>
<footer><strong>NXT GEN ESPORTS SCRIMS</strong><span>Built for the grind.</span></footer>
<script src="script.js"></script>
</body>
</html>
